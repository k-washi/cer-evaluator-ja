[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cer-evaluator-ja"
version = "0.1.0"
description = "Japanese CER with optional fillers and annotated reference alternatives"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "k-washi", email = "bandad.kw@gmail.com" }]
dependencies = [
    "rapidfuzz>=3.9,<4",
    "sudachipy>=0.6.10,<0.7",
    "sudachidict-core==20260116",
]

[project.scripts]
cer-evaluator-ja = "cer_evaluator_ja.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/cer_evaluator_ja"]

[tool.hatch.build.targets.sdist]
include = ["src/cer_evaluator_ja", "tests", "docs", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
